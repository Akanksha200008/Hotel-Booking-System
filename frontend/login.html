<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | Hotel Booking</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      height: 100%;
      background: url('images/logpic.png') no-repeat center center fixed;
      background-size: cover;
      position: relative;
      color: white;
    }

    .navbar {
      background-color: #007BFF;
      color: white;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .navbar h1 {
      margin: 0;
      font-size: 20px;
      white-space: nowrap;
    }

    .navbar-buttons {
      display: flex;
      gap: 10px;
    }

    .navbar button {
      background-color: #0056b3;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .container {
      max-width: 400px;
      background: white;
      color: black;
      padding: 30px;
      margin: 50px auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      border-radius: 10px;
      text-align: center;
    }

    input, button {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      background: #007BFF;
      color: white;
      font-weight: bold;
      border: none;
    }

    a {
      color: #007BFF;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- ✅ Navbar -->
  <div class="navbar">
    <h1>Welcome to Luxury Stays</h1>
    <div class="navbar-buttons">
      <button onclick="window.location.href='index.html'">Home</button>
      <button onclick="logout()" id="logoutBtn" style="display:none">Logout</button>
    </div>
  </div>

  <div class="container">
    <h2>Login</h2>
    <input type="email" id="email" placeholder="Gmail ID" required>
    <input type="password" id="password" placeholder="Password" required>
    <button onclick="loginUser()">Login</button>
    <p id="message"></p>
    <p>Don't have an account? <a href="customer_auth.html">Register here</a></p>
  </div>

  <script>
    // Clear any existing session on login page load
    localStorage.removeItem("admin");
    localStorage.removeItem("customer");

    function logout() {
      localStorage.removeItem("admin");
      localStorage.removeItem("customer");
      window.location.href = "login.html";
    }

    async function loginUser() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const res = await fetch("http://127.0.0.1:5000/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();

      if (res.ok) {
        if (data.role === "admin") {
          localStorage.setItem("admin", data.username);
          window.location.href = "admin.html";
        } else if (data.role === "customer") {
          localStorage.setItem("customer", data.username);
          const selectedRoomId = localStorage.getItem("selectedRoomId");
          window.location.href = "rooms.html";
        } else {
          document.getElementById("message").innerText = "Unknown role detected.";
        }
      } else {
        document.getElementById("message").innerText = data.error || "Login failed.";
      }
    }
  </script>
</body>
</html>
