<!-- ✅ Updated register.html with Navbar and Clean Layout -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register | Hotel Booking</title>
  <style>
    /* body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f4f4;
    } */
    body, html {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      height: 100%;
      background: url('images/regpic.png') no-repeat center center fixed;
      background-size: cover;
      position: relative;
      color: white;
    }

    .navbar {
      background-color: #007BFF;
      padding: 15px 30px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar h1 {
      margin: 0;
      font-size: 20px;
    }

    .navbar button {
      background-color: #0056b3;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .container {
      max-width: 400px;
      background: white;
      padding: 30px;
      margin: 50px auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      border-radius: 10px;
      text-align: center;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      background: #28a745;
      color: white;
      font-weight: bold;
      border: none;
    }

    a {
      color: #007BFF;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- ✅ Navbar -->
  <div class="navbar">
    <h1>Welcome to Hotel Booking</h1>
    <button onclick="window.location.href='index.html'">Home</button>
  </div>

  <!-- ✅ Registration Form -->
  <div class="container">
    <h2>Register</h2>
    <input type="email" id="email" placeholder="Gmail ID" required>
    <input type="text" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>
    <!-- <select id="role">
      <option value="customer">Customer</option>
      <option value="admin">Admin</option>
    </select> -->
    <button onclick="registerUser()">Register</button>
    <p id="message"></p>
    <p>Already have an account? <a href="login.html">Login here</a></p>
  </div>

  <script src="auth.js"></script>
</body>
</html>
